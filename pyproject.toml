[project]
name = "ai-tax-desk-api"
version = "0.1.0"
description = """\
API for an AI front desk for Brazilian accounting firms: \
answers from official tax sources, \
with citations and hand-off to the accountant."""
readme = "README.md"
authors = [
    { name = "ageu_dev19", email = "ageumenezes423@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-tax-desk-api = "ai_tax_desk_api:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
